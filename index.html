<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival: The Purge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(to bottom, #1a0000, #000000);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            position: relative;
        }
        .scene-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #dddddd;
            margin-bottom: 30px;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 40px;
        }
        button {
            background-color: rgba(20, 20, 20, 0.8);
            border: 2px solid #ff3333;
            color: #ffffff;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #ff3333;
            color: #000000;
            box-shadow: 0 0 15px #ff3333;
        }
        .status {
            font-size: 0.85rem;
            color: #888888;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="scene-box">
            <h1 id="scene-title">Amaran Purge</h1>
            <p id="scene-text">Bunyi siren bergempa di luar tingkap. Pintu bilik anda diketuk seseorang dengan kuat. Apa tindakan anda?</p>
        </div>

        <div class="choices">
            <button id="btn-1" onclick="handleChoice(1)">A: Buka Pintu</button>
            <button id="btn-2" onclick="handleChoice(2)">B: Kunci & Bersembunyi</button>
        </div>

        <div class="status">STATUS: HIDUP | HARI 1</div>
    </div>

    <script>
        function handleChoice(option) {
            const title = document.getElementById('scene-title');
            const text = document.getElementById('scene-text');
            const btn1 = document.getElementById('btn-1');
            const btn2 = document.getElementById('btn-2');

            if (option === 1) {
                title.innerText = "Anda Terkorban";
                text.innerText = "Anda membuka pintu dan mendapati sekumpulan penceroboh bertopeng berdiri di situ. Permainan tamat.";
                btn1.style.display = "none";
                btn2.innerText = "MAIN SEMULA";
                btn2.onclick = resetGame;
            } else {
                title.innerText = "Selamat Buat Sementara";
                text.innerText = "Anda mengunci pintu rapat-rapat dan bersembunyi di dalam almari. Anda terselamat untuk malam ini.";
                btn1.style.display = "none";
                btn2.innerText = "TERUSKAN HARI KEDUA";
                btn2.onclick = resetGame;
            }
        }

        function resetGame() {
            location.reload();
        }
    </script>

</body>
</html>
